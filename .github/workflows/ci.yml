name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders. Real secrets are injected by the hosting
      # platform; CI only needs values that pass env validation.
      MONGODB_URI: mongodb://127.0.0.1:27017/employee_management
      JWT_SECRET: ci-only-placeholder-secret-at-least-32-characters
      JWT_EXPIRES_IN: 7d
      NEXT_PUBLIC_APP_NAME: Employee Management

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
