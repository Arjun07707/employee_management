services:
  mongo:
    image: mongo:7
    container_name: ems-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
    container_name: ems-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Points at the bundled Mongo by default. Export MONGODB_URI in your
      # shell (or use an .env file) to use Atlas instead.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/employee_management}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
